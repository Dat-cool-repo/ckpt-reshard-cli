[package]
name = "ckpt-reshard-cli"
version = "0.1.0"
edition = "2024"
description = "ckpt: inspect, convert, reshard and diff ML checkpoints (safetensors, HF sharded, PyTorch DCP/FSDP, Megatron-LM, DeepSpeed ZeRO) without Python or torch"
license = "MIT OR Apache-2.0"
authors = ["Dat-cool-repo contributors"]
repository = "https://github.com/Dat-cool-repo/ckpt-reshard-cli"
homepage = "https://github.com/Dat-cool-repo/ckpt-reshard-cli"
readme = "README.md"
keywords = ["checkpoint", "safetensors", "pytorch", "megatron", "deepspeed"]
categories = ["command-line-utilities", "science"]
exclude = ["/data", "/.github"]

[[bin]]
name = "ckpt"
path = "src/main.rs"

[lib]
name = "ckpt"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
