name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (unit + CLI tests on tests/fixtures/tiny, no Python)
        run: cargo test --release

  # End-to-end tests against real torch.distributed checkpoints (CPU torch, 4 gloo ranks).
  # The Megatron-LM and DeepSpeed suites need megatron-core / deepspeed and run locally via
  # scripts/test_all.sh.
  e2e-torch:
    name: End-to-end (Linux, CPU torch)
    runs-on: ubuntu-latest
    env:
      CKPT_DATA_DIR: ${{ github.workspace }}/data
      CKPT_BIN: ${{ github.workspace }}/target/release/ckpt
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install CPU torch and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.18.0 safetensors==0.8.0 numpy==2.5.3 pytest==9.1.1
      - name: Build ckpt
        run: cargo build --release
      - name: Generate DCP / HF fixtures
        run: python scripts/make_fixtures.py --out "$CKPT_DATA_DIR/fixtures"
      - name: pytest (DCP, HF, dtype, GQA tensor parallel, zip64, safety)
        run: >
          python -m pytest -q -p no:cacheprovider tests/test_roundtrip.py tests/test_formats.py
          -k "not megatron and not deepspeed and not verify_detects_corruption"
