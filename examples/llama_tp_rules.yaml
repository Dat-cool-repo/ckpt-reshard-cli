# Megatron-style tensor parallelism for HF Llama / Qwen2 / Mistral checkpoints
# (nn.Linear weights are [out, in]: column parallel = dim 0, row parallel = dim 1).
#
# Head counts are named, not hard-coded: `ckpt reshard` reads them from the source's config.json
# (or --model-config path/config.json); a `config:` map here overrides them.
#
# GQA: q heads are split evenly (num_attention_heads % tp == 0). kv heads are split evenly when
# num_key_value_heads % tp == 0. Otherwise (tp > kv heads, tp % kv heads == 0) each kv head is
# replicated on tp/kv consecutive ranks, so rank r holds kv head r // (tp/kv). That is exactly the kv
# head its q heads attend to. Merging checks that the replicas are identical.
#
# Vocab: embeddings and lm_head are padded with zero rows to a multiple of tp * pad_multiple (like
# Megatron's --make-vocab-size-divisible-by), and the padding is dropped again on merge.
#
#   ckpt reshard ./qwen2 --tp 4 --rules examples/llama_tp_rules.yaml -o ./qwen2_tp4
#   ckpt reshard ./qwen2_tp4 -o merged.safetensors          # bit-exact round trip
#   ckpt reshard ./qwen2_tp4 --tp 8 -o ./qwen2_tp8           # re-split without the rules
default: replicate
# config:
#   num_attention_heads: 32
#   num_key_value_heads: 8
rules:
  # attention: column-parallel q/k/v (bias too, Qwen2), row-parallel o_proj
  - {pattern: "*.self_attn.q_proj.weight", dim: 0, heads: num_attention_heads}
  - {pattern: "*.self_attn.q_proj.bias",   dim: 0, heads: num_attention_heads}
  - {pattern: "*.self_attn.k_proj.weight", dim: 0, kv_heads: num_key_value_heads}
  - {pattern: "*.self_attn.k_proj.bias",   dim: 0, kv_heads: num_key_value_heads}
  - {pattern: "*.self_attn.v_proj.weight", dim: 0, kv_heads: num_key_value_heads}
  - {pattern: "*.self_attn.v_proj.bias",   dim: 0, kv_heads: num_key_value_heads}
  - {pattern: "*.self_attn.o_proj.weight", dim: 1, heads: num_attention_heads}
  # fused q|k|v (Phi-3 style qkv_proj = cat(q, k, v) along dim 0): each rank gets its q heads + kv heads
  - pattern: "*.self_attn.qkv_proj.weight"
    dim: 0
    sections: [{heads: num_attention_heads}, {kv_heads: num_key_value_heads}, {kv_heads: num_key_value_heads}]
  # MLP: gate/up column parallel, down row parallel
  - {pattern: "*.mlp.gate_proj.weight", dim: 0}
  - {pattern: "*.mlp.up_proj.weight",   dim: 0}
  - {pattern: "*.mlp.down_proj.weight", dim: 1}
  # fused gate|up (Phi-3 gate_up_proj): two equal blocks, each split separately
  - {pattern: "*.mlp.gate_up_proj.weight", dim: 0, parts: 2}
  # vocab-parallel embedding / output layer with padding
  - {pattern: "*.embed_tokens.weight", dim: 0, pad_multiple: 64}
  - {pattern: "lm_head.weight",        dim: 0, pad_multiple: 64}
  # everything else (norms, o_proj/down biases) is replicated
